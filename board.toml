# Board description of the Meizu 20 Classic (m2381, SM8550), read by the
# unixnu build driver — schema v2 (2026-10-26 migration, upstream 16e592a).
#
# Layering (tables merge by key, arrays replace inherited arrays):
#   profiles/arch/arm64      ARM64 configuration, patch series, archive base
#   feeds.toml → sm8550      SoC registers/DTSI/config/patches (UniXNU-sm8550-common)
#   profiles/os/ipados…      the 21H461 OS profile: [ipsw], [kernel.prelink],
#                            text fixups, trust-cache pins, typed ADT identity
#   this file                board wiring, userdata geometry, firmware and
#                            payload policy, archive plan
#
# Value provenance, following the nx729j discipline:
#   [DTB]    read from docs/hardware/stock-fdt.dts (the DT the stock ABL hands
#            to the payload on this phone; decompiled from the live device)
#   [DEVICE] measured on the phone (date + method in the comment)
#   [FW]     derived from the stock firmware package / ABL reverse engineering
#
# ABL constraints that shape this file (nura/docs/BOOT-CHAIN-RE.md §5, static
# RE of this phone's LinuxLoader, plus 2026-10-22/23 live evidence):
#   * the ABL gunzip window is [0x80080000, 0x85580000) ≈ 85 MiB total for
#     kernel + ramdisk + DT gap. A fuxi-style 192 MiB ramdisk payload makes
#     RdLoad go negative and trips the "Not Enough space" check — the payload
#     CANNOT ride in the boot image ramdisk on this phone, unlike sheng/fuxi.
#     Hence loader = firmware and the payload volume lives on the recovery_a
#     ESP (the negroni precedent), read through the UEFI UFS driver.
#   * boot header v4 (Flyme stock shape), kernel member gzipped, no appended
#     DTB (the stock vendor_boot DTB is used and passes BoardDtMatch).
#
# The target OS image is the unchanged iPad7,1 (iPad Pro 12.9-inch 2nd gen)
# iOS 17.7.11 restore image — the fuxi/nx729j donor, byte-for-byte the same
# build those boards pair with the xnu-10063 source, described by the OS
# profile (user decision 2026-10-24, second swap of the day: the 21H16 iPhone
# XS cache turned out to be a fileset kernel collection the prelink kit could
# not rebind yet; the tablet identity is a deliberate trade-off that gets
# revisited once the fileset-KC rebinder — carried in kits/XnuPrelink — is
# wired into this lane).

schema_version = 2

[board]
name = "m2381"
soc = "SM8550"
description = "Meizu 20 Classic"
kit = "sheng"                      # package/ of this repository appears as kits/sheng in the build tree (fuxi same: build-sheng-platform-power.py reads kits/sheng/ShengPlatformPower.cpp)
soc_source = "sm8550"              # feeds.toml pins UniXNU-sm8550-common
os_profile = "ipados-27.0.1-24A446"

# The raw image for the userdata partition: the OS and SystemOS disk images of
# the IPSW behind a manifest.
#
# [DEVICE] 2026-10-23, measured twice via the nura OS (USB net, devsh):
#   * sysfs: sda22 start 18,643,776 / size 972,326,040 sectors at 512 B;
#   * the numbers below are those converted to 4096 B LBAs (LUN 0 logical
#     block size is 4096, read from /sys/class/block/sda/queue — same trap
#     as nx729j), consistent with the on-device GPT.
[userdata]
first_lba = 0x238f68              # 2330472, 4 KiB sectors  [DEVICE]
last_lba = 0x7621ffa              # 123871226               [DEVICE]
lba_bytes = 4096
# Stage 7 (2026-10-25): launchd exec'd but dyld had no libSystem and no dyld
# cache — both live in the Cryptex1,SystemOS volume, so the cryptex window
# returns now and the owner cache mount unions it over "/" (kern_exec
# OWNER_CACHE_MOUNT/OWNER_UNION_SYSTEMOS, cache volume 96096B28-… since the
# 20H392 donor swap).
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Component selection. Adreno740 pulls Sm8550Platform/AdrenoPM4/AdrenoFirmware/
# ArmSmmu4K from the catalog's dependency graph; ShengUfs resolves to this
# repository's drivers/ShengUfs fork (SMMU takeover of the ABL hand-off state,
# single-window publication, 16 KiB verification blocks — see git history),
# and XnuPrelink/VerifiedRoot to the kits/ forks (the 21H461 Libm literal
# pools and the VR 16 KiB manifest parameter are m2381-local and must not be
# silently replaced by the upstream submodules).
[components]
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "VirtioMmioBlock",
  "RamBlock",
  # The display lane (CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y): the component's
  # NativeLegacyDisplay.cpp/NativeGOPPresenter.cpp compile through
  # build-arm-driver.py inside build-native-legacy-display.py — no component:
  # archive entry (its recipe is empty; the qualified archive is hand-built).
  "GopFramebuffer",
  # The AppleKeyStore stand-in (r62): materialized so the display pipeline can
  # build it into the late display archive (the asteroid/sheng/oneplus13t
  # template). The baseline link never links its archive directly, so there is
  # no double-link with the archive member.
  "AppleKeyStoreState",
  "XnuPrelink",
  "DarwinBoot",
  "VerifiedRoot",
]

[kernel]
defconfig = "m2381_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Archive builders of the kernel step, in order. component: entries expand to
# the catalog recipes; bare names are this tree's scripts. The v1 plan ran
# audit-storage-interface.py (fuxi's live-machine lldb evidence: gdb-stop.json,
# impossible on a fresh runner) — replaced by the nx729j static binding
# (build-storage-bindings.py + prelink-storage-bindings.json, the measured
# 190 IOBlockStorageDevice slots of the same donor kernelcache), which is what
# the bring-up lane has linked since round 17. The verified-root stub refuses
# placeholders when no policy evidence is staged; build-verified-root-
# if-evidenced.py replaces it with the real probe archive when ci-owner-
# policy.sh (macos.yml pre_build) has staged the OS/SystemOS policies.
# 2026-10-29 (ipados-26.5.2-23F84 arm64e lane): reshaped onto the proven sheng
# arm64e subset. Dropped with their defconfig gates (m2381_defconfig) — every
# entry below is a 21H461-donor-pinned provider and returns per-topic when
# re-derived for the 23F84 donor (phase 2):
#   build-storage-bindings.py (190-slot pin + arm64e AUTH vtable relocs),
#   build-verified-root-stub.py / build-verified-root-if-evidenced.py
#     (20H392/21H461 policies; this lane's root model is upstream
#     source-storage — not yet wired for m2381),
#   component:VirtioMmioBlock + its verified-root bundle + transport record,
#   build-storage-transport-record.py NativeRamBlock, build-mockfs-fixture.py,
#   build-sheng-platform-power.py (PMGR prelinked from the fileset roots),
#   build-native-legacy-display.py (358-slot gates are 21H461; the only
#     upstream arm64e display fixture is 24A446-only).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "component:RamBlock",
  # The real BootProgress diagnostic (XNU_BOOT_PROGRESS=1: BootWatchdogPolicy
  # answers launchd's watchdogd panic-on-crash) reads the sheng monitor
  # surfaces this board leaves off (legacy display, touch, Adreno, cpufreq,
  # Wi-Fi), and this ld64 errors on unresolved weak references where Apple's
  # binds them to zero. BootProgressTelemetryDefs.c links those zeros
  # explicitly; the qualified providers replace them with their topics.
  "build-boot-progress-telemetry.py",
  # The AppleKeyStoreState component recipe (the v2 archive contract):
  # produces build/apple-key-store-state/{AppleKeyStoreState.o,
  # libAppleKeyStoreState.a}. The late-staged object rides in the prelink
  # staging; the baseline link has no direct keystore gate.
  "component:AppleKeyStoreState",
  "build-libpthread-kernel.py",
  # Adreno740 (component + build-adreno740-kits.py) is deferred: the kit
  # embeds the board-local GPU inputs that upstream keeps out of git
  # (ShengGmu*Source.h OPP/bandwidth policy per docs/porting/gpu.md, plus the
  # .cache/firmware/sheng-gpu pinned blobs) and CONFIG_XNU_NATIVE_ADRENO=n
  # skips the libAdreno740.a link requirement. Bring-up to launchd needs no
  # GPU; the chain returns with its own topic once those inputs are ported.
]
# [kernel.prelink] is inherited from the OS profile (ipados-27.0.1-24A446):
# tool kits/XnuPrelink/emit_prelink.py (the kits/XnuPrelink vendored copy of
# this repository shadows the upstream submodule in the assembled tree), the
# 24A446 kernelcache sha 38e6d9fa…, slide -0x1000000 and the AMFI early-init
# pointer. The 24A446 collection is an MH_FILESET, so emit_prelink takes the
# fileset emitter; --allow-missing pairs with the kernel-side
# fileset-unmapped-call.patch (arch series): every unmatched call binds to the
# reporting stub instead of failing emission, and the JSON report lists the
# unresolved targets per kext. The 21H16-era arm64e classical-path fork this
# replaces (return value: git history, pre-2026-10-30) predates the fileset
# pipeline.
["kernel"."prelink"]
"extra_args" = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf", "--allow-missing"]

[device_tree]
source = "device:dts/m2381.dts"
include_dirs = ["soc:dts"]

# The UEFI firmware package for this phone is built on the shengPkg skeleton
# (UniXNU/uefi-sheng shape) with the proven platform constants of the nura
# Mu chain: FD at 0xA7100000+0x300000, BootShim with kernel header + Gunyah
# watchdog disable, boot header v4, gzip, no appended DTB. See
# docs/STATE.md §5-A3 for the base decision record. The uefi checkout is
# the uefi-m2381 repository at ../uefi-m2381 (branch main, based on upstream
# uefi-sheng sheng@0eb4514 with the nura-proven overlay committed directly;
# consolidated 2026-10-29 — the devices/m2381/uefi overlay and sync.sh are
# retired).
[firmware]
config = "m2381"                   # Resources/Configs/m2381.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Meizu/m2381Pkg/m2381.dsc"
fd = "Build/m2381Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-m2381.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Meizu",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Secure Boot is OFF: the forensic log reader is an unsigned Linux PE loaded
# with LoadImage from the payload volume (FLASHING.md §7); the iOS chain does
# not depend on it — kernel.macho is not a PE and its trust travels in the
# trust cache / AMFI, and every module the firmware itself runs lives in the
# FV, which never goes through the LoadImage verification path.
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "m2381"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "m2381-research"

# The payload volume: a FAT image with the UniXNU config, the kernel, the ADT
# and the optional trust cache and Data seed, written to the recovery_a
# partition ([DEVICE] 2026-10-30 fastboot getvar: 0x6400000 = 100 MiB).
# Volume at 99 MiB since the 24A446 switch (2026-11-05): the 27.0.1 fileset
# kernel fills the ESP payload to 92 MiB (the 23F84 one was ~86.5), and 96
# tripped the 95% build gate. DarwinBoot (in the firmware volume) reads it
# through the UFS driver.
# The ADT is assembled by the schema v2 generator from dts/m2381.dts, the OS
# profile's typed identity and the [payload.adt] options below; the v1
# scripts/make-m2381-adt.py stays in the repository as the reference for
# what those produce.
[payload]
volume = "M2381ESP"
size_mib = 99
loader = "firmware"
title = "m2381 first boot: source 4K XNU to console"
dram_size = "0x400000000"            # [DEVICE] 16 GiB LPDDR5X
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true
# Probe round 2 (2026-10-30): stage 3 fired (device reset ~5 s after the
# magenta bar) = execution passes the MMU-enable sequence. The reset probe
# stands down so the boot-progress diagnostic page can live: it freezes on
# stall with stage history — one photograph pinpoints the stop. If the freeze
# lands before the page's first paint, fall back to stage 4 resets (note:
# _arm_init @0xb0b11b0 is a thin wrapper — one bl to _OSRuntimeSignStructors
# then ret — pick the bisect function from the real init body).
# The forensic log reader is OFF in this payload again (2026-10-30 split
# decision, user): the reader rides its own dedicated ESP image flashed to
# recovery_a per forensic mission (forensic/build-forensic-esp.py in this
# repository, trio from .cache/forensic — the proven nura v71 kernel
# 4aad92b3, NOT the benched 3.79 MiB minimal build), so the iOS payload no
# longer carries it and size pressure with the growing fileset kernel is
# gone. History: ON 2026-10-30 with the minimal reader (payload 0f1013f4,
# flashed) — first boot died in the zboot decompressor on the XPU-fenced
# tz_stat page (FAR 0x82700020) that RamManagerDxe handed out as conventional
# RAM; fixed in uefi-m2381 MemoryMapLib (adsp_mhi/global_sync/tz_stat added).
forensic = false
# sha256 of the trust caches of this 24A446 build: the two IM4P members
# (extracted from the local IPSW via "unixnu ipsw fetch"; BuildManifest role
# mapping resolved 2026-11-05: StaticTrustCache rides the OS dmg 043-68950-668,
# Cryptex1,SystemTrustCache the SystemOS dmg 043-69086-713) and the flat
# two-module bundle made by scripts/make-m2381-trust-bundle.py (DarwinBoot/
# kernel need the bare container). Overrides the profile's bundle-only pin.
# The 23F84 set this replaces (e70a385a/58960bbc/ebeaf7fb) stays as the
# rollback lane's pins (git history, 2026-11-05 lane switch).
trust_cache_sha256 = [
  "dc3642e0b44bcb3912126b19770cffcf07b9fb40f7196df32d54bb54acc0550a",   # StaticTrustCache (043-68950-668.dmg.aea.trustcache, 3547 entries)
  "34d6186ffd6278b66ac06c9b86961ba3dd195bd120ce2b8278c0f89d48eda7db",   # Cryptex1,SystemTrustCache (043-69086-713.dmg.aea.trustcache, 130 entries)
  "dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf",   # original-trust-24A446.bundle (3547+130 entries, loader-rule self-check PASS)
]
# text_fixups are inherited from the OS profile (the nx729j set for the same
# donor build: AWAttentionAwareness init, PosterBoard file protection,
# BTAudioHALPlugin factory).
# Case A (2026-10-30): the sheng arm64e bring-up baseline (their feat27 board
# line) instead of the 21H461-era 983-byte diagnostic queue — the offline-* /
# sheng-* probe args below it are all retired with that lane (the components
# still link; their probes stay inert without the args). The first-boot
# judgment gates read the serial console, not the arg-gated probes:
# native-pac-keys per-core key programming, the fileset binding counts,
# native-source-storage=1 taking effect. noidle=1 keeps the r70 idle-sleep
# halt away; native-source-storage=1 is the source-storage master switch
# (SourceStorage.cpp gates on it); -no_slto_panic and use_contiguous_hint=0
# ride the sheng baseline verbatim.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "use_contiguous_hint=0",
  "native-source-storage=1",
  "native-ufs-root=1",
  "noidle=1",
  # Upstream blind-zone channel (guide/debugging): the on-screen diagnostic
  # page — 120x48 stage history, registers, storage counters; freezes on
  # stall so a photograph pinpoints the stop. Zero geometry cost (arg only).
  "boot-progress=2",
  # BootLog UFS window (package/BootLog.c, the r41 wiring): 8 KiB slot every
  # 2 s into the 32 MiB window at the userdata tail — the forensic reader's
  # cargo (scripts/read-m2381-ufs-log.py parses it; ~17 min to wrap).
  "sheng-log=1",
]

[payload.adt]
chip_id = "207"                     # [DTB] qcom,msm-id 0x207 (SM8550-AB) — same value sheng/nx729j use
owned_memory_size = "0x130000000"
# root_match_volume_uuid of the donor OS image's root volume: the 27.0.1
# (24A446) profile carries it (os volume 2F8E6EED…, donor iPad17,3/j820ap);
# the 23F84 value (546DFF4A…) retired with that lane (git history,
# 2026-11-05 lane switch).
root_match_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"
packed_data_ramdisk = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
# cpu identity moved to dts/m2381.dts (the v1 generator's cpu_regs list,
# 0x000..0x700, is the SoC DTSI's eight enabled cores).

# No [bootimg] table here, unlike sheng.
#
# [FW] The boot image carries no appended DTB at all (nura-proven on this
# ABL: BootShim header + gzip kernel member only; the stock vendor_boot DTB
# supplies the splash region and passes BoardDtMatch). Nothing to patch.
