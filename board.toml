# Board description of the Meizu 20 Classic (m2381, SM8550), read by the
# unixnu build driver — schema v2 (2026-10-26 migration, upstream 16e592a).
#
# Layering (tables merge by key, arrays replace inherited arrays):
#   profiles/arch/arm64      ARM64 configuration, patch series, archive base
#   feeds.toml → sm8550      SoC registers/DTSI/config/patches (UniXNU-sm8550-common)
#   profiles/os/ipados…      the 21H461 OS profile: [ipsw], [kernel.prelink],
#                            text fixups, trust-cache pins, typed ADT identity
#   this file                board wiring, userdata geometry, firmware and
#                            payload policy, archive plan
#
# Value provenance, following the nx729j discipline:
#   [DTB]    read from docs/hardware/stock-fdt.dts (the DT the stock ABL hands
#            to the payload on this phone; decompiled from the live device)
#   [DEVICE] measured on the phone (date + method in the comment)
#   [FW]     derived from the stock firmware package / ABL reverse engineering
#
# ABL constraints that shape this file (nura/docs/BOOT-CHAIN-RE.md §5, static
# RE of this phone's LinuxLoader, plus 2026-10-22/23 live evidence):
#   * the ABL gunzip window is [0x80080000, 0x85580000) ≈ 85 MiB total for
#     kernel + ramdisk + DT gap. A fuxi-style 192 MiB ramdisk payload makes
#     RdLoad go negative and trips the "Not Enough space" check — the payload
#     CANNOT ride in the boot image ramdisk on this phone, unlike sheng/fuxi.
#     Hence loader = firmware and the payload volume lives on the recovery_a
#     ESP (the negroni precedent), read through the UEFI UFS driver.
#   * boot header v4 (Flyme stock shape), kernel member gzipped, no appended
#     DTB (the stock vendor_boot DTB is used and passes BoardDtMatch).
#
# The target OS image is the unchanged iPad7,1 (iPad Pro 12.9-inch 2nd gen)
# iOS 17.7.11 restore image — the fuxi/nx729j donor, byte-for-byte the same
# build those boards pair with the xnu-10063 source, described by the OS
# profile (user decision 2026-10-24, second swap of the day: the 21H16 iPhone
# XS cache turned out to be a fileset kernel collection the prelink kit could
# not rebind yet; the tablet identity is a deliberate trade-off that gets
# revisited once the fileset-KC rebinder — carried in kits/XnuPrelink — is
# wired into this lane).

schema_version = 2

[board]
name = "m2381"
soc = "SM8550"
description = "Meizu 20 Classic"
kit = "sheng"                      # package/ of this repository appears as kits/sheng in the build tree (fuxi same: build-sheng-platform-power.py reads kits/sheng/ShengPlatformPower.cpp)
soc_source = "sm8550"              # feeds.toml pins UniXNU-sm8550-common
os_profile = "ipados-27.0.1-24A446"

# The raw image for the userdata partition: the OS and SystemOS disk images of
# the IPSW behind a manifest.
#
# [DEVICE] 2026-10-23, measured twice via the nura OS (USB net, devsh):
#   * sysfs: sda22 start 18,643,776 / size 972,326,040 sectors at 512 B;
#   * the numbers below are those converted to 4096 B LBAs (LUN 0 logical
#     block size is 4096, read from /sys/class/block/sda/queue — same trap
#     as nx729j), consistent with the on-device GPT.
[userdata]
first_lba = 0x238f68              # 2330472, 4 KiB sectors  [DEVICE]
last_lba = 0x7621ffa              # 123871226               [DEVICE]
lba_bytes = 4096
# Stage 7 (2026-10-25): launchd exec'd but dyld had no libSystem and no dyld
# cache — both live in the Cryptex1,SystemOS volume, so the cryptex window
# returns now and the owner cache mount unions it over "/" (kern_exec
# OWNER_CACHE_MOUNT/OWNER_UNION_SYSTEMOS, cache volume 96096B28-… since the
# 20H392 donor swap).
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Component selection. Adreno740 pulls Sm8550Platform/AdrenoPM4/AdrenoFirmware/
# ArmSmmu4K from the catalog's dependency graph; ShengUfs resolves to this
# repository's drivers/ShengUfs fork (SMMU takeover of the ABL hand-off state,
# single-window publication, 16 KiB verification blocks — see git history),
# and XnuPrelink/VerifiedRoot to the kits/ forks (the 21H461 Libm literal
# pools and the VR 16 KiB manifest parameter are m2381-local and must not be
# silently replaced by the upstream submodules).
[components]
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "VirtioMmioBlock",
  "RamBlock",
  # The display lane (CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y): the component's
  # NativeLegacyDisplay.cpp/NativeGOPPresenter.cpp compile through
  # build-arm-driver.py inside build-native-legacy-display.py — no component:
  # archive entry (its recipe is empty; the qualified archive is hand-built).
  "GopFramebuffer",
  # The AppleKeyStore stand-in (r62): materialized so the display pipeline can
  # build it into the late display archive (the asteroid/sheng/oneplus13t
  # template). The baseline link never links its archive directly, so there is
  # no double-link with the archive member.
  "AppleKeyStoreState",
  "XnuPrelink",
  "DarwinBoot",
  "VerifiedRoot",
]

[kernel]
defconfig = "m2381_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Archive builders of the kernel step, in order. component: entries expand to
# the catalog recipes; bare names are this tree's scripts. The v1 plan ran
# audit-storage-interface.py (fuxi's live-machine lldb evidence: gdb-stop.json,
# impossible on a fresh runner) — replaced by the nx729j static binding
# (build-storage-bindings.py + prelink-storage-bindings.json, the measured
# 190 IOBlockStorageDevice slots of the same donor kernelcache), which is what
# the bring-up lane has linked since round 17. The verified-root stub refuses
# placeholders when no policy evidence is staged; build-verified-root-
# if-evidenced.py replaces it with the real probe archive when ci-owner-
# policy.sh (macos.yml pre_build) has staged the OS/SystemOS policies.
# 2026-10-29 (ipados-26.5.2-23F84 arm64e lane): reshaped onto the proven sheng
# arm64e subset. Dropped with their defconfig gates (m2381_defconfig) — every
# entry below is a 21H461-donor-pinned provider and returns per-topic when
# re-derived for the 23F84 donor (phase 2):
#   build-storage-bindings.py (190-slot pin + arm64e AUTH vtable relocs),
#   build-verified-root-stub.py / build-verified-root-if-evidenced.py
#     (20H392/21H461 policies; this lane's root model is upstream
#     source-storage — not yet wired for m2381),
#   component:VirtioMmioBlock + its verified-root bundle + transport record,
#   build-storage-transport-record.py NativeRamBlock, build-mockfs-fixture.py,
#   build-sheng-platform-power.py (PMGR prelinked from the fileset roots),
#   build-native-legacy-display.py (358-slot gates are 21H461; the only
#     upstream arm64e display fixture is 24A446-only).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "component:RamBlock",
  # The real BootProgress diagnostic (XNU_BOOT_PROGRESS=1: BootWatchdogPolicy
  # answers launchd's watchdogd panic-on-crash) reads the sheng monitor
  # surfaces this board leaves off (legacy display, touch, Adreno, cpufreq,
  # Wi-Fi), and this ld64 errors on unresolved weak references where Apple's
  # binds them to zero. BootProgressTelemetryDefs.c links those zeros
  # explicitly; the qualified providers replace them with their topics.
  "build-boot-progress-telemetry.py",
  # The AppleKeyStoreState component recipe (the v2 archive contract):
  # produces build/apple-key-store-state/{AppleKeyStoreState.o,
  # libAppleKeyStoreState.a}. The late-staged object rides in the prelink
  # staging; the baseline link has no direct keystore gate.
  "component:AppleKeyStoreState",
  "build-libpthread-kernel.py",
  # Adreno740 (component + build-adreno740-kits.py) is deferred: the kit
  # embeds the board-local GPU inputs that upstream keeps out of git
  # (ShengGmu*Source.h OPP/bandwidth policy per docs/porting/gpu.md, plus the
  # .cache/firmware/sheng-gpu pinned blobs) and CONFIG_XNU_NATIVE_ADRENO=n
  # skips the libAdreno740.a link requirement. Bring-up to launchd needs no
  # GPU; the chain returns with its own topic once those inputs are ported.
  # 2026-11-14 (r116, s105): the 10-29 retirement of build-native-legacy-display.py
  # was correct for the 23F84 lane and wrong to stay for 24A446 -- the r115 sealed
  # kernel carried zero display components (offline-legacy-*/NativeLegacyDisplay
  # string census all zero) and FBSDisplayMonitor found no display service. This
  # is the sheng 24A446 display builder port (display core only): the reviewed
  # fixture legacy-display-24A446.json (kernelcache sha 38e6d9fa... = this lane's
  # donor pin) drives the class ABI; the sheng board suite (HID, USB, WiFi, ADSP,
  # audio, battery, backlight, GPU power, keyboard) stays out. Needs the kernel
  # step env XNU_NATIVE_LEGACY_DISPLAY=1 (the link gate at
  # build-xnu-4k-baseline.sh force_loads build/native-legacy-display/
  # libNativeLegacyDisplay.late.a against its build-report.json sha) and the
  # hook sites the arm64e series' offline-legacy-start.patch already patches.
  "build-gop-legacy-display-27.py",
]
# [kernel.prelink] is inherited from the OS profile (ipados-27.0.1-24A446):
# tool kits/XnuPrelink/emit_prelink.py (the kits/XnuPrelink vendored copy of
# this repository shadows the upstream submodule in the assembled tree), the
# 24A446 kernelcache sha 38e6d9fa…, slide -0x1000000 and the AMFI early-init
# pointer. The 24A446 collection is an MH_FILESET, so emit_prelink takes the
# fileset emitter; --allow-missing pairs with the kernel-side
# fileset-unmapped-call.patch (arch series): every unmatched call binds to the
# reporting stub instead of failing emission, and the JSON report lists the
# unresolved targets per kext. The 21H16-era arm64e classical-path fork this
# replaces (return value: git history, pre-2026-10-30) predates the fileset
# pipeline.
["kernel"."prelink"]
"extra_args" = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf", "--allow-missing"]

[device_tree]
source = "device:dts/m2381.dts"
include_dirs = ["soc:dts"]

# The UEFI firmware package for this phone is built on the shengPkg skeleton
# (UniXNU/uefi-sheng shape) with the proven platform constants of the nura
# Mu chain: FD at 0xA7100000+0x300000, BootShim with kernel header + Gunyah
# watchdog disable, boot header v4, gzip, no appended DTB. See
# docs/STATE.md §5-A3 for the base decision record. The uefi checkout is
# the uefi-m2381 repository at ../uefi-m2381 (branch main, based on upstream
# uefi-sheng sheng@0eb4514 with the nura-proven overlay committed directly;
# consolidated 2026-10-29 — the devices/m2381/uefi overlay and sync.sh are
# retired).
[firmware]
config = "m2381"                   # Resources/Configs/m2381.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Meizu/m2381Pkg/m2381.dsc"
fd = "Build/m2381Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-m2381.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Meizu",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Secure Boot is OFF: the forensic log reader is an unsigned Linux PE loaded
# with LoadImage from the payload volume (FLASHING.md §7); the iOS chain does
# not depend on it — kernel.macho is not a PE and its trust travels in the
# trust cache / AMFI, and every module the firmware itself runs lives in the
# FV, which never goes through the LoadImage verification path.
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "m2381"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "m2381-research"

# The payload volume: a FAT image with the UniXNU config, the kernel, the ADT
# and the optional trust cache and Data seed, written to the recovery_a
# partition ([DEVICE] 2026-10-30 fastboot getvar: 0x6400000 = 100 MiB).
# Volume at 99 MiB since the 24A446 switch (2026-11-05): the 27.0.1 fileset
# kernel fills the ESP payload to 92 MiB (the 23F84 one was ~86.5), and 96
# tripped the 95% build gate. DarwinBoot (in the firmware volume) reads it
# through the UFS driver.
# The ADT is assembled by the schema v2 generator from dts/m2381.dts, the OS
# profile's typed identity and the [payload.adt] options below; the v1
# scripts/make-m2381-adt.py stays in the repository as the reference for
# what those produce.
[payload]
volume = "M2381ESP"
size_mib = 99
loader = "firmware"
title = "m2381 first boot: source 4K XNU to console"
dram_size = "0x400000000"            # [DEVICE] 16 GiB LPDDR5X
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true
# r129 capacity round (2026-11-15): the 91.4 MiB fileset kernel left 5.4 MiB on
# this volume and the recovery_a partition itself is 100 MiB, so growth
# (GPU/audio/addon) had nowhere to go. kernel_compression = "lzma" stores the
# LZMA-alone stream in the kernel.macho member (props byte 0x5D + known size in
# the header, dict 16 MiB; measured 91 -> 17.5 MiB); DarwinBoot expands it
# before ParseKernel and the sidecar names stay identical. Plain members are
# still accepted, so an uncompressed kernel boots the same volume unchanged.
kernel_compression = "lzma"
# r74 wiring (2026-11-07, first SourceStorage boot r73 payload f38d11cc t=31s:
# "SourceStorage: root policy handoff or authentication failed" @SourceStorage.cpp:102 —
# the kernel step builds the VROOTB01 envelope (build/sheng-source-storage/root-policies.bin)
# and embeds the same trusted key (RootAnchor.c), but the payload never carried it:
# no .vroot on the ESP, no RootPolicies in /chosen/memory-map. The full-table bundle
# (30.5 MB, OS+SystemOS) cannot fit the 99 MiB ESP next to the 91.4 MiB fileset kernel,
# so the lane runs tables-in-userdata mode: build the kernel step with
#   XNU_SOURCE_STORAGE_TABLES=userdata
# (bundle shrinks to two 544-byte signed headers; NativeUfs then reads the full tables
# from the "<window>.vroot" version-2 objects of the userdata image, which must be
# rebuilt with --object OS.vroot=<pair>/OS/manifest.bin
#            --object SystemOS.vroot=<pair>/SystemOS/manifest.bin
# — the pair lives at .cache/firmware/verified-root-24A446/{OS,SystemOS} on the Mac,
# generated 2026-11-05 by build-owner-policies-local.py from userdata-root.json and the
# profile [root] pins; the r73 kernel's embedded key sha256 74e60348… is that pair's).
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
# Probe round 2 (2026-10-30): stage 3 fired (device reset ~5 s after the
# magenta bar) = execution passes the MMU-enable sequence. The reset probe
# stands down so the boot-progress diagnostic page can live: it freezes on
# stall with stage history — one photograph pinpoints the stop. If the freeze
# lands before the page's first paint, fall back to stage 4 resets (note:
# _arm_init @0xb0b11b0 is a thin wrapper — one bl to _OSRuntimeSignStructors
# then ret — pick the bisect function from the real init body).
# The forensic log reader is OFF in this payload again (2026-10-30 split
# decision, user): the reader rides its own dedicated ESP image flashed to
# recovery_a per forensic mission (forensic/build-forensic-esp.py in this
# repository, trio from .cache/forensic — the proven nura v71 kernel
# 4aad92b3, NOT the benched 3.79 MiB minimal build), so the iOS payload no
# longer carries it and size pressure with the growing fileset kernel is
# gone. History: ON 2026-10-30 with the minimal reader (payload 0f1013f4,
# flashed) — first boot died in the zboot decompressor on the XPU-fenced
# tz_stat page (FAR 0x82700020) that RamManagerDxe handed out as conventional
# RAM; fixed in uefi-m2381 MemoryMapLib (adsp_mhi/global_sync/tz_stat added).
forensic = false
# sha256 of the trust caches of this 24A446 build: the two IM4P members
# (extracted from the local IPSW via "unixnu ipsw fetch"; BuildManifest role
# mapping resolved 2026-11-05: StaticTrustCache rides the OS dmg 043-68950-668,
# Cryptex1,SystemTrustCache the SystemOS dmg 043-69086-713) and the flat
# two-module bundle made by scripts/make-m2381-trust-bundle.py (DarwinBoot/
# kernel need the bare container). Overrides the profile's bundle-only pin.
# The 23F84 set this replaces (e70a385a/58960bbc/ebeaf7fb) stays as the
# rollback lane's pins (git history, 2026-11-05 lane switch).
trust_cache_sha256 = [
  "dc3642e0b44bcb3912126b19770cffcf07b9fb40f7196df32d54bb54acc0550a",   # StaticTrustCache (043-68950-668.dmg.aea.trustcache, 3547 entries)
  "34d6186ffd6278b66ac06c9b86961ba3dd195bd120ce2b8278c0f89d48eda7db",   # Cryptex1,SystemTrustCache (043-69086-713.dmg.aea.trustcache, 130 entries)
  "dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf",   # original-trust-24A446.bundle (3547+130 entries, loader-rule self-check PASS)
]
# text_fixups are inherited from the OS profile (the nx729j set for the same
# donor build: AWAttentionAwareness init, PosterBoard file protection,
# BTAudioHALPlugin factory).
# Case A (2026-10-30): the sheng arm64e bring-up baseline (their feat27 board
# line) instead of the 21H461-era 983-byte diagnostic queue — the offline-* /
# sheng-* probe args below it are all retired with that lane (the components
# still link; their probes stay inert without the args). The first-boot
# judgment gates read the serial console, not the arg-gated probes:
# native-pac-keys per-core key programming, the fileset binding counts,
# native-source-storage=1 taking effect. noidle=1 keeps the r70 idle-sleep
# halt away; native-source-storage=1 is the source-storage master switch
# (SourceStorage.cpp gates on it); -no_slto_panic and use_contiguous_hint=0
# ride the sheng baseline verbatim.
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "use_contiguous_hint=0",
  "native-source-storage=1",
  "native-ufs-root=1",
  # r76 first boot (wall-77, SourceStorage.cpp:124 root step 3 "root window
  # preparation failed", phase=Prepare): the full diagnostic panic channel
  # (rootDiagnosticFailure -> formatUfsRootDiagnostics, stage=WINDOWS/verify=
  # lines) is gated on this arg and the panic screen carried only the generic
  # wrapper. Zero code cost: arg only, the pipe is already built.
  "native-ufs-diagnostics=1",
  "noidle=1",
  # Upstream blind-zone channel (guide/debugging): the on-screen diagnostic
  # page — 120x48 stage history, registers, storage counters; freezes on
  # stall so a photograph pinpoints the stop. Zero geometry cost (arg only).
  "boot-progress=2",
  # BootLog UFS window (package/BootLog.c, the r41 wiring): 8 KiB slot every
  # 2 s into the 32 MiB window at the userdata tail — the forensic reader's
  # cargo (scripts/read-m2381-ufs-log.py parses it; ~17 min to wrap).
  "sheng-log=1",
  # r102 (s90): the r101 32-frame launchd stack pinned the r94 wall to
  # AccessoryInteraction.handleMeDeviceUpdate aborting pid 1 at the first
  # MKBGetDeviceLockState failure — this no-SEP board has nothing answering
  # the unchanged libaks/MobileKeyBag AppleKeyStore state queries (the exact
  # situation upstream's sirius/sheng records document; sheng enables the
  # answer service with aks=1). The publication probe rides KeyStoreProbe.cpp
  # (offline-keystore=1 wrapper, offline-key-events=1 service publish, aks=1
  # user client answering selector 7 "unlocked-since-boot"; key wrapping
  # seeds from /chosen/unique-chip-id, already in the payload ADT); all three
  # gates are self-gated so the kernel stays inert on lanes that do not pass
  # the args.
  # r122 (s110 verdict): offline-keystore=1 REMOVED — arg-only round. s109
  # byte-proved the r119/r120 31s wall-76 deaths were the emit kit losing
  # TEXT_WORD_PATCHES (9 stations), NOT this arg and NOT its SEP-load kick
  # (r121 restored the triple with a fixed kit and ran green, 1775s lane
  # record), so the s108 fix lands WITHOUT the KeyStoreProbe de-mutex hunk:
  # the mutex gate opens naturally once the arg is gone and the keyevents
  # service can publish (sheng production ships this exact pair). The
  # de-mutex hunk is demoted to the r123 fallback, only if keyevents still
  # refuses with the arg absent.
  # History: offline-keystore=1 is mutually exclusive with offline-key-events
  # in KeyStoreProbe.cpp — passing both made the
  # keyevents service refuse to publish with kIOReturnNotPermitted for every
  # boot since r102 (AKS st=-536870174 sg=1 opens=0 calls=0), and the real
  # AppleSEPKeyStore it loads never starts on a no-SEP board anyway (its
  # personality needs an arm-io SEP node this ADT does not carry).
  # liveactivitiesd then crash-loops in SessionSyncEngine: its MobileKeyBag
  # events registration ("mkb events" IOGeneralInterest on the AppleKeyStore
  # service) finds no service and returns nil into a force unwrap (upstream
  # venus record = same wall, fixed by the notification service +
  # offline-key-events=1 + aks=1; sheng production ships the same pair
  # without offline-keystore).
  "offline-key-events=1",
  "aks=1",
  # r112 (s102, r111 first boot): watchdogd spawned 3x and brk'd itself each
  # time ("connect_to_kext() unexpectedly failed - unable to lookup watchdog
  # KEXT service") — the donor AppleARMWatchdogTimer kext IS in our kernel but
  # its personality needs an arm-io "wdt" device node that this ADT does not
  # carry (and the Qualcomm WDT has different register semantics anyway), so
  # the "IOWatchdog" service never publishes. The BootWatchdogPolicy lane is
  # the validated answer (20H392 r36-r43; sheng Pad 6S Pro production ships
  # the same arg on this SoC): write com.apple.watchdogd into launchd's
  # disabled.plist at the pre-exec policy point. Symbolic "IOWatchdog" service
  # remains a later-lane option (upstream raphael/nx769j records).
  "sheng-disable-watchdogd=1",
  # r112 (s102, r111 first boot): containermanagerd died 3x at spawn, at
  # +[MCMSQLiteDB openDBWithURL:] — sqlite3_open_v2(READWRITE|CREATE) cannot create
  # /private/var/root/Library/MobileContainerManager/containers.sqlite3 on a fresh Data
  # volume (no /var/root/Library chain; the OS volume ships no data-side template) and
  # the MCMLibraryRepair permissions retry cannot mkdir; launchd's
  # _PanicOnConsecutiveCrash(deadline 60) then drove the diagnostic screen. The
  # BootWatchdogPolicy lane now presets the daemon's path skeleton (store root +
  # PendingUpdates/Replace/Delete + Caches/System/Dead, root-owned 0755; sqlite creates
  # the database file itself) behind this arg. Path evidence = the 24A446 dyld cache RE
  # (scratch-r112 REPORT-cache-symbolication.md §6/§7).
  "sheng-container-db=1",
  # r126 (s115 verdict, upstream recon): the r125 window pinned the render
  # stall to SpringBoard parking on launchservicesd from t=81 s — the fresh-
  # seed Data lineage's first-boot churn (lsd grinding 7 threads at r=3-4,
  # system sys=61%) never lets SB's LaunchServices registration complete, so
  # SB never activates, the compositor caps at 4 swaps (queue depth) and
  # chronod keeps aborting at CASGetDisplays -308. The r122 flood boot (SB
  # free-running the whole window) ran on the pre-reset accumulated Data
  # lineage; sheng's upstream answer for exactly this face is sheng-lite=1
  # (BootWatchdogPolicy.c lite_jobs): a launchd disabled-jobs policy for the
  # ~22 daemons that "start at the first boot of a fresh Data and compete
  # with SpringBoard for the CPU and for memory", whose first four are "the
  # cycle of synchronous XPC waits the isolation work found". The machinery
  # is already vendored (lite_jobs table + PE parse + the disabled.plist /
  # disabled.migrated write, every boot after Data mounts, before the
  # unchanged launchd exec) — only the arg was never passed. Upstream
  # d76556b reference: reference/unixnu-sheng/board.toml line 74.
  "sheng-lite=1",
  # r114 (s103): the r112/r113 "policy panicked EBUSY(16) on its first Data
  # write" root cause. The Data disk is the 16 GiB packed RamBlock (r111 window
  # "RAMDISK sparse=1 capacityMiB=16384 residentKiB=1008"; seed d04a0153 is the
  # grown 1008 KiB image). RamBlock serves a >2 GiB disk by the direct
  # store-backed path ALONE (NativeRamBlock.cpp isBig branch): with the store
  # closed every write returns kIOReturnNotReady — reads ride the seed, writes
  # are only "successful" while they sit in the page cache. The r111 boot never
  # fsynced Data (the policy was inert without its args), so the first device
  # write was the 179.7 s userland fsync storm ("device is not ready" paired
  # 1:1 with "cluster_push() failed with 16"). r112's policy fsync is the first
  # device write of the boot: EBUSY(16) at 2 s. Since the 24A446 Case-A args
  # rewrite dropped sheng-data-persist, this lane has had NO writable Data at
  # all (the 21H461 lane carried it: r41a "D st=2 resumed wr=12"). mode 2
  # (direct) is the only writable mode for an isBig disk (mode 1 keeps
  # direct=false and even lands on a null sparse.pages Loader path — do not
  # use). sheng production ships the same arg on this SoC. Geometry pre-checked
  # (s103): window 4,194,434 blocks (16 GiB) at first LBA 119,414,649 in the
  # 121,540,755-block userdata partition, 1 GiB log reserve at the tail — all
  # native_ufs_store_open gates pass; checkHeader carries only
  # magic/pages/seed-hash so the grown seed's store is position-independent.
  # native_ufs_store_write_cached is absent, so direct runs write-through
  # (forced unit access per write; fsync = doSynchronizeCache success).
  "sheng-data-persist=2",
  # s118 (2026-11-15): the whole 24A446 lane has been running single-core on
  # the boot A510 — every slot printed "SMP req=0 run=0 cond=0 boot=0" (the
  # ArmCpu tracker armcpu_smp_requested stayed 0 = no secondary-start request
  # was ever issued) and the profiler's per-cpu tick counters (recorded in the
  # timer-IRQ path from getCpuDatap()->cpu_number) show c0-only for every
  # process. The device stayed cool all boot while sys burned 80%+ on one
 #  little core; the v1 board ran these and booted hot with every core up
 #  (dts/m2381.dts:9 note). The args were swept out at 73de03e (10-30 "args
 #  全换案甲 … sheng-* 诊断队整体退役") along with the diagnostic flags, though
 #  their consumers were live the whole time. Upstream sheng d76556b
 #  board.toml carries all three (sheng- prefix retired upstream: smp=1).
 #  All three must travel together:
 #    smp=1              ArmCpu.cpp:249 — secondary startup is opt-in; without
 #                       it ArmCpu::probe returns nullptr for every non-boot
 #                       cpu node, so the SM8550's 8 cores collapse to 1.
 #    armcpu-spi-ipi=1   ICC_SGI1R_EL1 generates nothing on this board
 #                       (ArmCpu.cpp:34) — cross-core IPIs must go as
 #                       software-pended SPIs 1008+core.
 #    armcpu-self-ipi=1  every core self-signals SGI 0 at initCPU to clear
 #                       the startup SIGPdisabled flag; without it a started
 #                       core spins its idle thread at full speed (the
 #                       zzye-sheng-cpu-idle.patch recovery only papers it).
 #  cpufreq=4 (upstream also carries it) is NOT carried here: the cpufreq
 #  component is not vendored in this tree (native_cpufreq_stage has no
 #  definer), so the arg would have no consumer.
 #  Red line for the round: args-only, kernel binary unchanged, and NEVER
 #  data-reset — the 5-boot Data lineage is the asset this change
 #  accelerates.
  "smp=1",
  "armcpu-spi-ipi=1",
  "armcpu-self-ipi=1",
  # r124 (s113): the IOMFB user-client selector probe. The
  # iomfb-uc-selector-probe.patch hooks IOUserClient::callExternalMethod (the
  # non-virtual funnel every is_io_connect_method branch uses) into the
  # LegacyDisplayProbe recorder; this arg arms it. It answers "which selector
  # exchange does backboardd stall in" — the r123b window pinned the render
  # server's display creation to open-then-park (CLIENT calls=1 pid=64 status=0
  # at t=98 s, then mach_msg2 forever). REMOVED in r128 (s119): the question is
  # answered (r127: UC i=185->193 climbing = the IOMFB UC channel is alive and
  # thawed; swap bursts validated) and the arm arg goes with the round. The
  # patch stays in the tree; inert without the arg (the hot path is one
  # volatile load).
  # r123b (s112, one-shot): the BLSH-suppression round re-injected the Data
  # seed (add mobile/Library/Preferences/com.apple.BacklightServices.plist via
  # inject-prefs-into-data-seed.py), which CHANGES the seed identity — and the
  # on-device store window still carries the r122-era overlay bound to the old
  # seed hash (PersistOverlay checkHeader -> 3 = foreign seed -> Open::Kept,
  # overlay inactive, direct=false: every Data write fails NotReady(16) and the
  # launch policy panics at first exec — the r112/r113 wall shape, this time
  # seeded by the surgery, not a missing arg). data-reset=1 forces Fresh so the
  # store re-binds to the new seed; REMOVED in r124 (s113) — the one-shot
  # re-bind landed in r123b (overlay now bound to the 9c28654c seed; r123b
  # window shows DATA st=3 hdr=3 healthy). It must NOT come back in ordinary
  # builds — it wipes the store every boot (the r114 note's standing warning).
  # NOTE (r114 first boot, s103; supersedes the s102 "thrash left the volume
  # unwritable" reading): the one-shot first-boot payload adds data-reset=1
  # (NativeRamBlock discardRequested(): start the overlay over; the r43
  # precedent, r113 rode the same arg inertly at mode 0). The on-device store
  # region (~446.5 GiB) holds unknown 21H461-era state — the reflashed userdata
  # image (14.5 GiB) never reaches it — and without reset a foreign/blank
  # header means Open::Kept (overlay.active=false, direct=false: writes STILL
  # fail NotReady). Reset forces Fresh, which works for every on-device state.
  # The arg must NOT come back in ordinary builds — it wipes the store every
  # boot; do not re-add unless a volume reset is explicitly wanted again.
  # Session-55: fips_mode (FIPS_MODE_FLAG_DISABLE, session-54) withdrawn.
  # The upstream source-corecrypto14-bootstrap gate (prng_random.c:665,
  # STARTUP SYSCTL RANK_LAST, before the provider start) panics
  # "source corecrypto verification requires complete default POST" on any
  # fips_mode != 0 — r55 died at that gate (crc 0x27f71c47, zero-correct
  # hit) before fipspost_post ever ran, so the s54 slot rebinds went
  # untested. The POST must run complete: the HMAC is again computable
  # since the emitter rebind (TEXT_WORD_PATCHES cleared, FIPS hash segment
  # [0xac12c00,0xac818b0) donor-identical, session-54), leaving only the
  # KAT surface as the unknown — triage as a normal sentinel wall if hit.
  # r115 (s104): the display lane, dark since session-13's Case-A args rewrite
  # retired the whole offline-legacy-*/sheng-* team (73de03e, 2026-10-30).
  # r114 verdict: SpringBoard sig5-loops 475x at FBSDisplayMonitor
  # _initWithDisplays:.cold.6 (init failure branch) — FBDisplayManager's first
  # dispatch_once cannot find a display, and the r114 window proves the whole
  # stack dark: GOP actual mapping =0 / DISPLAY stage=0 / IOMFB_FDR_Loader
  # exit=1. sheng (same SoC, Pad 6S Pro) runs the native legacy display stack,
  # NOT donor IOMFB: these args arm exactly the consumers already compiled
  # into this kernel (drivers/GopFramebuffer/NativeLegacyDisplay.cpp +
  # NativeGOPPresenter.cpp + package/LegacyDisplayProbe.cpp). The UEFI -> XNU
  # video chain needs no new code: DarwinBoot BootVideo.h fills boot_args.Video
  # from the firmware GOP, xnu pe_init.c:458 fills PE_state.video, and
  # NativeGOPPresenter::start maps it behind PE_current_console. Arg-by-arg
  # provenance (every one is a real PE_parse_boot_argn consumer in this tree;
  # sheng board args with no consumer here — offline-apfs-load,
  # boot-ui-focus4, sheng-backlight, sheng-touch,
  # sheng-lite — are deliberately NOT carried; offline-mobile-graphics-load IS
  # carried since r117: its consumer is the bsd_init.c hook in
  # offline-component-load-probes.patch, not the driver tree — the r115 recon
  # missed it and both r115/r116 boots ran the display lane dark with stage
  # stuck at 0, because native_legacy_display_probe() is only ever called
  # behind that gate + a successful IOMobileGraphicsFamily load):
  #   offline-legacy-register=1  NativeLegacyDisplay.cpp:554 the explicit
  #                              offline system-client registration experiment
  #   offline-legacy-gop=1       NativeLegacyDisplay.cpp:983 the GOP presenter
  #                              arm path
  #   offline-legacy-pm=1        NativeLegacyDisplay.cpp:524 logical power
  #                              management for the display family
  #   offline-legacy-validate=1  NativeLegacyDisplay.cpp:905 swap-gate
  #                              validation
  #   offline-legacy-transfer=1  NativeLegacyDisplay.cpp:596 transfer path
  #   offline-legacy-cpu-present=1 NativeLegacyDisplay.cpp:789 cpu-present
  #                              quirk (alongside offline-legacy-retire, whose
  #                              default sheng also rides)
  #   offline-legacy-phase=4     NativeLegacyDisplay.cpp:526/478 + probe:478/
  #                              520/424 — the phase-4 lifecycle sheng ships
  #   offline-legacy-unit-scale=2 LegacyDisplayProbe.cpp:421 display-scale/
  #                              rotation unit policy (sheng same value)
  #   offline-mobile-graphics-load=1  bsd_init.c hook (offline-component-load-
  #                              probes.patch): loads IOMobileGraphicsFamily,
  #                              then calls native_legacy_display_probe() behind
  #                              offline-legacy-register. The lane's only arg
  #                              trigger; without it r115/r116 sat at stage=0.
  #   fb-gpu=1                   NativeGOPPresenter.cpp:107 + probe (24A446 fork)
  #                              the GPU hand-off wiring; the component dropped
  #                              the sheng- prefix (GopFramebuffer fa2fa49), so
  #                              r115's sheng-fb-gpu=1 had no consumer
  #   vsync=120                  NativeLegacyDisplay.cpp:108 work-loop vsync
  #                              tick in Hz (sheng same value; timer only arms
  #                              once a client registers and a boot mapping
  #                              exists)
  # Judgment gates (R115-CARD): GOP actual mapping virtual/physical/bytes all
  # nonzero, DISPLAY stage advances, and SpringBoard stops sig5-looping at
  # _initWithDisplays:.cold.6.
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-legacy-unit-scale=2",
  "offline-mobile-graphics-load=1",
  "fb-gpu=1",
  "vsync=120",
  # r116 forensics: SpringBoard crash-looped twice this boot (p118/p126 corpses
  # @157s/176s) with zero sheng-exc output because the exception dumper's default
  # name list is "backboardd,chronod,liveactivitiesd". PE_parse_boot_argn
  # overwrites that default, so the full list is repeated here plus SpringBoard;
  # the sheng_exc_ring[4] rows also land in the [spawn] log section, which
  # survives the msg-ring's ~60 s wrap.
  "sheng-exc-name=SpringBoard,backboardd,chronod,liveactivitiesd",
  # r128 (s119, power round): the ADSP charging family rides the kernel again —
  # the r81 charging stack was wired on the 21H461 lane (build-native-legacy-
  # display.py) but the 24A446 lane's display archive (build-gop-legacy-
  # display-27.py, "display core only") never carried it, so the r119 work
  # order's premise "the probe is already in the kernel, self-gated" was false
  # (kernel.map had zero adsp/battery symbols). r128 wires it: family synced to
  # upstream 70251d8 (70186fe dropped the sheng- prefix, so the arg names are
  # the upstream ones; AdspProbe.cpp carries the m2381 firmware-source fork),
  # compiled into libNativeLegacyDisplay.late.a, called from the late probe.
  #   adsp=2     AdspProbe.cpp sheng_adsp_probe: bring the audio DSP up (PAS
  #              load + auth + reset via SCM, SMP2P/GLINK/QMP/RPMh) so its
  #              firmware can serve PMIC GLINK — this board's battery manager
  #              (battmgr) runs ON the ADSP (nura's mainline port proves the
  #              firmware: qcom_battmgr/charging work over the same channel).
  #              adsp=1 is the read-only survey. Firmware source order: the
  #              boot_b segment first (package-m2381-boot.py --adsp-mbn appends
  #              the squashed stock images; ABL tail tolerance proven r83),
  #              then modem:, then VFS dirs. Firmware staged: adsp.mbn
  #              30,499,631 B (sha256 acf95fd5) + adsp_dtb.mbn 12,420 B
  #              (db6a6478) from the vendor-fw-harvest squash.
  #   battery=1  BatteryProbe.cpp sheng_battery_probe: publish the
  #              IOPMPowerSource (ShengBattery.cpp) powerd reads for the status
  #              bar/lock screen/Settings. Optional: with battery absent,
  #              adsp=2 alone auto-enables it (BatteryProbe.cpp:19) — carried
  #              explicitly for legibility.
  # Judgment gates B0-B2 (R128-CARD): [battery] row st/pct/mv/ma/fl nonzero +
  # [adsp] st=ready; B1 charging bits visible; B2 regression sentinels.
  "adsp=2",
  "battery=1",
]

[payload.adt]
chip_id = "207"                     # [DTB] qcom,msm-id 0x207 (SM8550-AB) — same value sheng/nx729j use
owned_memory_size = "0x130000000"
# root_match_volume_uuid of the donor OS image's root volume: the 27.0.1
# (24A446) profile carries it (os volume 2F8E6EED…, donor iPad17,3/j820ap);
# the 23F84 value (546DFF4A…) retired with that lane (git history,
# 2026-11-05 lane switch).
root_match_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"
packed_data_ramdisk = true
unique_chip_id = "required"          # the platform seed is not stored in any repository
# cpu identity moved to dts/m2381.dts (the v1 generator's cpu_regs list,
# 0x000..0x700, is the SoC DTSI's eight enabled cores).

# No [bootimg] table here, unlike sheng.
#
# [FW] The boot image carries no appended DTB at all (nura-proven on this
# ABL: BootShim header + gzip kernel member only; the stock vendor_boot DTB
# supplies the splash region and passes BoardDtMatch). Nothing to patch.
