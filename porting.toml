procedure = ["package-m2381-boot.py produces the deterministic boot.img", "./unixnu payload + add-forensic-entry.py for the ESP payload", "fastboot --set-active=b (resets the ABL retry budget) then fastboot flash recovery_a; fastboot boot is dead (Meizu ABL strips CmdBoot)"]
