findings = ["r83 reverses the r56 pairing finding: the 17-generation walls (traitCollection/avocado widget/once domain/sel6 FDR gate) were all 21H461 userland+kext artifacts, and the xnu-10063.141.1 kernel pairs with the 16-gen 20H392 donor once the one dropped symbol is restored — the prelink closure binds 65346 sites with exactly 2 misses (_IORPCMessageFromMach, IOStorageFamily+IOHIDFamily), repaired by restore-iorpc-from-mach.patch (verbatim xnu-8796.101.5 body, extern C so the prelink name match does not mangle)", "The entropy guard is back in the series for the 16-gen corecrypto PRNG ordering (the r11 wall, dormant since the 2026-10-24 swap)", "Donor pairing must be same-generation: the xnu-10063.141.1 source against a 16-gen donor failed everywhere (entropy, AppleImage4); the 17.7 21H461 donor cleared those walls", "text fixups are inherited from the OS profile (the nx729j set for the same donor build) and are applied lazily at page-in, so the applied counter doubles as an execution oracle", "OS profile text_fixups grew from 13 to 16 entries during the =y lane (fixups 8a/8b/11/12/9 in r47-r56)"]
