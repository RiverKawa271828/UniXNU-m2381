[device]
name = "m2381"
soc = "SM8550"
os_profile = "ios-16.7.16-20H392"
summary = "Meizu 20 Classic (SM8550 phone, 16 GB LPDDR5X, 1080x2400 BOE AMOLED cmd-mode DSC, UFS 4.0 512 GB). The per-area records below carry r55e/r56 on-device evidence from the 21H461 donor lane; r83 (2026-10-29) swapped back to the original iPhone10,3 iOS 16.7.16 pairing, rebuilt the verified-root policies and both volume UUIDs, repaired the cross-generation prelink gap, and produced the first 20H392 payload — first flash pending."

